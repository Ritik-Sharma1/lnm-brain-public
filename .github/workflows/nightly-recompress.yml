name: Nightly LLM Recompress

on:
  schedule:
    - cron: '0 2 * * *'   # 2 AM UTC (7:30 AM IST)
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to recompress (default 30)'
        default: '30'
        type: string

concurrency:
  group: recompress
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recompress:
    runs-on: ubuntu-latest
    name: LLM-recompress regex wiki pages
    steps:
      - name: Recompress pages via Worker /compress endpoint
        env:
          BRAIN_API_KEY: ${{ secrets.BRAIN_API_KEY }}
          BRAIN_URL: https://your-worker-subdomain.workers.dev
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '30' }}
        run: |
          cat > /tmp/recompress.py << 'PYEOF2'
          import os, json, base64, time, urllib.request, urllib.error, sys

          BRAIN_URL = os.environ["BRAIN_URL"].strip()
          API_KEY   = os.environ["BRAIN_API_KEY"].strip()
          GH_TOKEN  = os.environ["GH_TOKEN"].strip()
          REPO      = "your-username/your-repo"
          MAX_PAGES = int(os.environ.get("MAX_PAGES", "30"))
          GH_API    = "https://api.github.com"

          print(f"DEBUG: API_KEY len={len(API_KEY)} GH_TOKEN len={len(GH_TOKEN)}", flush=True)

          def gh_headers(raw=False):
              h = {
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "User-Agent": "lnm-recompress-action",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              h["Accept"] = "application/vnd.github.raw+json" if raw else "application/vnd.github+json"
              return h

          def gh_list(path):
              req = urllib.request.Request(f"{GH_API}/repos/{REPO}/contents/{path}", headers=gh_headers())
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          def gh_get_raw(path):
              req = urllib.request.Request(f"{GH_API}/repos/{REPO}/contents/{path}", headers=gh_headers(raw=True))
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode("utf-8")

          def gh_get_meta(path):
              req = urllib.request.Request(f"{GH_API}/repos/{REPO}/contents/{path}", headers=gh_headers())
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          def gh_put(path, content, message, sha):
              body = json.dumps({
                  "message": message,
                  "content": base64.b64encode(content.encode("utf-8")).decode(),
                  "sha": sha
              }).encode("utf-8")
              h = gh_headers()
              h["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{GH_API}/repos/{REPO}/contents/{path}", data=body, method="PUT", headers=h)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          def brain_compress(title, content, tags):
              url = f"{BRAIN_URL}/compress?key={API_KEY}"
              body = json.dumps({"title": title, "content": content, "tags": tags}).encode("utf-8")
              req = urllib.request.Request(url, data=body, method="POST",
                  headers={"Content-Type": "application/json",
                           "User-Agent": "lnm-recompress-action/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  body_bytes = e.read()[:500]
                  raise Exception(f"HTTP {e.code} body={body_bytes.decode(errors='replace')[:200]}")

          # Quick compress test before batch
          print("Testing /compress endpoint...", flush=True)
          try:
              test = brain_compress("ping", "test", [])
              print(f"  /compress OK: {test.get('compression','?')}", flush=True)
          except Exception as e:
              print(f"  /compress FAIL: {e}", flush=True)
              print("ABORT: Worker unreachable. Check CF WAF or API key.", flush=True)
              exit(1)

          print("Fetching wiki page list...", flush=True)
          wiki_files = gh_list("wiki/conversations")
          print(f"Total wiki pages: {len(wiki_files)}", flush=True)

          eligible = []
          for f in wiki_files:
              if not f["name"].endswith(".md"):
                  continue
              try:
                  content = gh_get_raw(f["path"])
                  if "compression: wiki\n" in content or "compression: wiki-regex-fallback" in content:
                      eligible.append({"name": f["name"], "path": f["path"], "content": content})
              except Exception as e:
                  print(f"  Skip {f['name']}: {e}", flush=True)

          print(f"Eligible for recompress: {len(eligible)}", flush=True)

          batch = eligible[:MAX_PAGES]
          success, failed = 0, 0

          for item in batch:
              fname    = item["name"]
              fpath    = item["path"]
              wcontent = item["content"]

              title = fname.replace(".md", "")
              tags  = []
              for line in wcontent.split("\n"):
                  if line.startswith("title:"):
                      title = line.split(":", 1)[1].strip()
                  if line.startswith("tags:"):
                      raw_tags = line.split(":", 1)[1].strip().strip("[]")
                      tags = [t.strip() for t in raw_tags.split(",") if t.strip()]

              raw_path = f"raw/conversations/{fname}"
              try:
                  source = gh_get_raw(raw_path)
              except Exception:
                  source = wcontent

              print(f"\n  Recompressing: {fname}", flush=True)
              try:
                  result   = brain_compress(title, source, tags)
                  new_wiki = result.get("compressed", "")

                  if "wiki-llm-" not in new_wiki:
                      print(f"    SKIP: LLM fell back to regex", flush=True)
                      failed += 1
                      continue

                  meta = gh_get_meta(fpath)
                  sha  = meta["sha"]
                  gh_put(fpath, new_wiki, f"recompress: LLM upgrade {fname}", sha)
                  print(f"    OK ({result.get('chars',0)} chars)", flush=True)
                  success += 1
                  time.sleep(2)

              except Exception as e:
                  print(f"    FAIL: {e}", flush=True)
                  failed += 1

          remaining = max(0, len(eligible) - MAX_PAGES)
          print(f"\n=== Done: {success} recompressed, {failed} failed, {remaining} remaining ===", flush=True)
          PYEOF2
          python3 /tmp/recompress.py

      - name: Health check
        env:
          BRAIN_URL: https://your-worker-subdomain.workers.dev
        run: |
          curl -s "$BRAIN_URL/health" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(f\"v{d.get('version','?')} | model: {d.get('compression_model','?')}\")" || true
