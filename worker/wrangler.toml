# LNM Brain worker config. Step-by-step setup: see INSTALL.md in the repo root.
#
# Before the first deploy you must:
#   1. set GITHUB_REPO below to YOUR private data repo ("owner/name"),
#   2. paste the KV namespace id and D1 database id printed by the create commands,
#   3. set the API_KEY and GITHUB_TOKEN secrets (never put secrets in this file).
#
# The worker name becomes part of your URL: https://<name>.<your-subdomain>.workers.dev
name = "my-lnm-brain"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GITHUB_REPO = "your-username/your-brain-data"
GITHUB_BRANCH = "main"

# Workers AI: bge-m3 embeddings (1024-dim) + the free fallback LLM.
[ai]
binding = "AI"

# Health-watch every 15 min (light). Heavy work (compression, backfill,
# consolidation, home-feed) is gated to specific hours inside handleCron.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

# KV: observations, entity facts, triples, session state, budgets.
#   npx wrangler kv namespace create VECTORS   → paste the printed id below.
[[kv_namespaces]]
binding = "VECTORS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Vectorize: semantic index (bge-m3, 1024 dimensions, cosine). Create once:
#   npx wrangler vectorize create lnm-brain-m3 --dimensions=1024 --metric=cosine
[[vectorize]]
binding = "VECTORIZE"
index_name = "lnm-brain-m3"

# D1: FTS5 keyword index. Schema is created on first ingest.
#   npx wrangler d1 create lnm-brain-fts   → paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "lnm-brain-fts"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
